<html>
	<head>
		<style>
			body { margin: 0; overflow: hidden; }
			canvas { width: 100%; height: 100%; }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
			} }
		</script>
	</head>
	<body>
		<script type="module">
		
			import * as THREE from "three";

			var renderer = new THREE.WebGLRenderer({antialias:true});
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( drawFrame );
			document.body.appendChild( renderer.domElement );

			var scene = new THREE.Scene();
			scene.background = new THREE.Color( 'seagreen' );
			
			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 30, aspect );
			camera.position.set( 0, 10, 5 );
			camera.lookAt( new THREE.Vector3() );


            //.......................................

            //врати
			var door_material = new THREE.MeshLambertMaterial( {color: 'gray'} );
			var handle_material = new THREE.MeshLambertMaterial( {color: 'white'} );
			var doors = new THREE.Group;

			function draw_doors(x_size, y_size, z_size, x_pos, y_pos, z_pos)
			{
                var door = new THREE.Group;
				var geometry = new THREE.BoxGeometry( x_size, y_size, z_size);
				var d = new THREE.Mesh(geometry, door_material);
				d.position.set( x_pos, y_pos, z_pos);
				d.receiveShadow = true;
				d.castShadow = true;
				door.add(d);

                var geometry = new THREE.BoxGeometry(0.2, 0.05, 0.05);
				var handle1 = new THREE.Mesh(geometry, handle_material);
                handle1.position.set(x_pos-0.25, y_pos, z_pos+0.1);
				handle1.receiveShadow = true;
				handle1.castShadow = true;
                door.add(handle1);

				var geometry = new THREE.BoxGeometry(0.05, 0.05, 0.05);
				var handle2 = new THREE.Mesh(geometry, handle_material);
                handle2.position.set(x_pos-0.325, y_pos, z_pos+0.05);
				handle2.receiveShadow = true;
				handle2.castShadow = true;
                door.add(handle2);

				var geometry = new THREE.BoxGeometry(0.2, 0.05, 0.05);
				var handle1 = new THREE.Mesh(geometry, handle_material);
                handle1.position.set(x_pos-0.25, y_pos, z_pos-0.1);
				handle1.receiveShadow = true;
				handle1.castShadow = true;
                door.add(handle1);

				var geometry = new THREE.BoxGeometry(0.05, 0.05, 0.05);
				var handle2 = new THREE.Mesh(geometry, handle_material);
                handle2.position.set(x_pos-0.325, y_pos, z_pos-0.05);
				handle2.receiveShadow = true;
				handle2.castShadow = true;
                door.add(handle2);

				var geometry = new THREE.CylinderGeometry(0.05, 0.05, 0.1, 32);
				var panta = new THREE.Mesh(geometry, handle_material);
				panta.position.set(x_pos+0.45, y_pos+0.67, 0);
				door.add(panta);

				var geometry = new THREE.CylinderGeometry(0.05, 0.05, 0.1, 32);
				var panta = new THREE.Mesh(geometry, handle_material);
				panta.position.set(x_pos+0.45, y_pos-0.67, z_pos);
				door.add(panta);

                doors.add(door);
				return door;
			}
            draw_doors(0.9, 2, 0.1, 0, 0, 0);
            scene.add(doors);

            //........................................			

			var light = new THREE.PointLight( 'white', 10 );
			light.position.set( 2, 2, 3 );
			scene.add( light );

			function drawFrame( t )
			{
				scene.rotation.y = t/2000;
				
				renderer.render( scene, camera );
			}
			
		</script>
	</body>
</html>
