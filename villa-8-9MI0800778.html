<!DOCTYPE html>

<!-- Магдалена Николаева Никкифорова -->

<html>
	<head>
		<style>
			body { margin: 0; }
			canvas { width: 100%; height: 100% }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.min.js",
				"csg/": "https://cdn.jsdelivr.net/gh/looeee/threejs-csg@main/src/CSG/",
				"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.min.js",
				"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.min.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
				"villa": "https://boytchev.github.io/CourseOKG/villa/villa.js"
			} }
		</script>
	</head>
	
	<body>
		<script type="module">
			import * as THREE from "three";
			import {CSG} from "csg/CSG.js"; 
			import {villa, renderer, scene, camera, light, controls} from "villa";

			villa( '9MI0800778' ); 			
			
			// center			
			var geometry = new THREE.BoxGeometry( 0.1, 0.1, 0.1 ),
				material = new THREE.MeshLambertMaterial( {color: 'crimson'} );				
			var cube = new THREE.Mesh( geometry, material );
				cube.position.set( 0, 0, 0 );
				cube.receiveShadow = true;
				cube.castShadow = true;			
			scene.add( cube );


			//стени
			var wall_material = new THREE.MeshLambertMaterial( {color: 'magenta'} );
			var hole_material = new THREE.MeshLambertMaterial( {color: 'blue'} );
			var walls = new THREE.Group;
			var holes = new THREE.Group;

			function draw_wall(x_size, y_size, z_size, x_pos, y_pos, z_pos)
			{
				var geometry = new THREE.BoxGeometry( x_size, y_size, z_size);
				var wall = new THREE.Mesh(geometry, wall_material);
				wall.position.set( x_pos, y_pos, z_pos);
				wall.receiveShadow = true;
				wall.castShadow = true;
				return wall;
			}

			function draw_holes(x_size, y_size, z_size, x_pos, y_pos, z_pos)
			{
				var geometry = new THREE.BoxGeometry( x_size, y_size, z_size);
				var hole = new THREE.Mesh(geometry, hole_material);
				hole.position.set( x_pos, y_pos, z_pos);
				return hole;
			}

			function subtract_one(wall, hole)
			{
				var csg = new CSG();
				csg.subtract( [wall, hole] );
					
				var c = csg.toMesh();
				c.material = new THREE.MeshLambertMaterial( {color:'magenta'} );
				c.receiveShadow = true;
				c.castShadow = true;
				walls.add(c);
				return c;				
			}
			function subtract_two(wall, hole1, hole2)
			{
				var csg = new CSG();
				csg.subtract( [wall, hole1] );
				var c = csg.toMesh();
				c.material = new THREE.MeshLambertMaterial( {color:'magenta'} );

				var csg1 = new CSG();
				csg1.subtract( [c, hole2] );
				var c1 = csg1.toMesh();
				c1.material = new THREE.MeshLambertMaterial( {color:'magenta'} );
				c1.receiveShadow = true;
				c1.castShadow = true;
				walls.add(c1);
				return c1;				
			}

			{//външни стени
				var front_wall = draw_wall(6, 3, 0.2, -1, 1.5, 4.9); //front
				walls.add(draw_wall(6, 3, 0.2, -1, 1.5, -4.9)); //back
				var left_wall = draw_wall(0.2, 3, 8, -4.9, 1.5, 0); //left
				var right_wall = draw_wall(0.2, 3, 8, 4.9, 1.5, 0); //right
				
				//corners
				walls.add(draw_wall(0.2, 3, 1, -3.9, 1.5, -4.3));
				walls.add(draw_wall(0.2, 3, 1, 1.9, 1.5, -4.3));
				walls.add(draw_wall(0.2, 3, 1, -3.9, 1.5, 4.3));
				walls.add(draw_wall(0.2, 3, 2, 1.9, 1.5, 4));

				walls.add(draw_wall(1, 3, 0.2, -4.5, 1.5, -3.9));
				walls.add(draw_wall(1, 3, 0.2, -4.5, 1.5, 3.9));
				walls.add(draw_wall(3, 3, 0.2, 3.5, 1.5, -3.9));
				var entry = draw_wall(3, 3, 0.2, 3.5, 1.5, 3.9);

			
			
			//вътрешни стени
			
				//right bedroom
				walls.add(draw_wall(2.2, 3, 0.2, 3.9, 1.5, 1.9)); //front wall
				var right_bed_left_wall = draw_wall(0.2, 3, 6, 1.9, 1.5, -2); //left wall

				//bathrooms
				var bathroom_front_wall = draw_wall(6, 3, 0.2, -1, 1.5, -3.1); //front wall
				walls.add(draw_wall(0.2, 3, 2, -0.1, 1.5, -4)); //middle wall 

				//storage room
				var storage_wall = draw_wall(0.2, 3, 2, -3.9, 1.5, -3); 

				//left bedroom and kitchen
				var bedroom_wall = draw_wall(6, 3, 0.2, -2, 1.5, -1.9); //back wall
				var kitchen_wall = draw_wall(0.2, 3, 4, 0.9, 1.5, 0); //right wall
				walls.add(draw_wall(0.2, 3, 4, -1.9, 1.5, 0)); //middle wall
				var front_kitchen_wall = draw_wall(6, 3, 0.2, -2, 1.5, 1.9); //front wall

				//diagonalni
				//var d1 = draw_wall(1.45, 3, 0.27, 2.305, 1.5, 1.405); //back wall
				//d1.rotation.y = -Math.PI/4;

			

			//дупки за врати и прозорци
			
				//prozorci
				var front_win = draw_holes(4, 1.5, 0.3, -1, 1.5, 4.9);

				var left_front_win = draw_holes(0.3, 1.5, 1.5, -4.9, 1.5, 2.9);
				var right_front_win = draw_holes(0.3, 1.5, 1.5, 4.9, 1.5, 2.9);

				var left_back_win = draw_holes(0.3, 1.5, 2, -4.9, 1.5, 0);
				var right_back_win = draw_holes(0.3, 1.5, 2, 4.9, 1.5, 0);

				//vrati
				var entry_door = draw_holes(1.5, 2, 0.3, 4, 1, 3.9);
				var r_bed_door = draw_holes(0.3, 2, 1, 1.9, 1, 0); //vrata 80 cm + 2*10 cm za ramka
				var kitchen_door = draw_holes(0.3, 2, 1, 0.9, 1, -1);
				var wc_door = draw_holes(1, 2, 0.3, 1, 1, -3.1);
				var bathroom_door = draw_holes(1, 2, 0.3, -1, 1, -3.1);
				var l_bed_door = draw_holes(1, 2, 0.3, -3, 1, -1.9);
				var storage_door = draw_holes(0.3, 2, 0.8, -3.9, 1, -2.5); //vrata 60 cm + 2*10 cm za ramka
				var kit_to_common_door = draw_holes(1, 3, 0.3, -0.5, 1.5, 1.9);

				subtract_one(front_wall, front_win);
				subtract_one(entry, entry_door);
				subtract_two(right_wall, right_back_win, right_front_win);
				subtract_two(left_wall, left_back_win, left_front_win);

				subtract_one(right_bed_left_wall, r_bed_door); 
				subtract_two(bathroom_front_wall, bathroom_door, wc_door);
				subtract_one(storage_wall, storage_door);
				subtract_one(bedroom_wall, l_bed_door);
				subtract_one(kitchen_wall, kitchen_door);
				subtract_one(front_kitchen_wall, kit_to_common_door);
			}

			scene.add(walls);

			//врати
			var door_material = new THREE.MeshLambertMaterial( {color: 'gray'} );
			var frame_material = new THREE.MeshLambertMaterial( {color: 'pink'} );
			var handle_material = new THREE.MeshLambertMaterial( {color: 'black'} );
			var doors = new THREE.Group;

			function draw_doors(x_size, y_size, z_size, x_pos, y_pos, z_pos)
			{
                var door = new THREE.Group;
				var geometry = new THREE.BoxGeometry( x_size, y_size, z_size);
				var d = new THREE.Mesh(geometry, door_material);
				d.position.set( x_pos, y_pos, z_pos);
				d.receiveShadow = true;
				d.castShadow = true;
				door.add(d);

                var geometry = new THREE.BoxGeometry(0.2, 0.05, 0.05);
				var handle = new THREE.Mesh(geometry, handle_material);
                handle.position.set(x_pos-(x_size/3.2), y_pos, z_pos+z_size);
				handle.receiveShadow = true;
				handle.castShadow = true;
                door.add(handle);

				var geometry = new THREE.BoxGeometry(0.05, 0.05, 0.05);
				var handle2 = new THREE.Mesh(geometry, handle_material);
                handle2.position.set(x_pos-(x_size/2.45), y_pos, z_pos+(z_size/2));
				handle2.receiveShadow = true;
				handle2.castShadow = true;
                door.add(handle2);

				var geometry = new THREE.BoxGeometry(0.2, 0.05, 0.05);
				var handle = new THREE.Mesh(geometry, handle_material);
                handle.position.set(x_pos-(x_size/3.2), y_pos, z_pos-z_size);
				handle.receiveShadow = true;
				handle.castShadow = true;
                door.add(handle);

				var geometry = new THREE.BoxGeometry(0.05, 0.05, 0.05);
				var handle2 = new THREE.Mesh(geometry, handle_material);
                handle2.position.set(x_pos-(x_size/2.45), y_pos, z_pos-(z_size/2));
				handle2.receiveShadow = true;
				handle2.castShadow = true;
                door.add(handle2);

				var geometry = new THREE.CylinderGeometry(0.05, 0.05, 0.1, 32);
				var panta1 = new THREE.Mesh(geometry, handle_material);
				panta1.position.set(x_pos+(x_size/2), y_pos+(y_size/3), z_pos);
				panta1.receiveShadow = true;
				panta1.castShadow = true;
				door.add(panta1);

				var geometry = new THREE.CylinderGeometry(0.05, 0.05, 0.1, 32);
				var panta2 = new THREE.Mesh(geometry, handle_material);
				panta2.position.set(x_pos+(x_size/2), y_pos-(y_size/3), z_pos);
				panta2.receiveShadow = true;
				panta2.castShadow = true;
				door.add(panta2);

				//ramka
				var geometry = new THREE.BoxGeometry(x_size+0.4, y_size+0.3, 0.3);
				var frame = new THREE.Mesh(geometry, frame_material);
                frame.position.set(x_pos, y_pos, z_pos);
				frame.receiveShadow = true;
				frame.castShadow = true;
                //door.add(frame);

				var geometry = new THREE.BoxGeometry(x_size+0.05, y_size+0.1, 0.4);
				var frame_hole = new THREE.Mesh(geometry, frame_material);
                frame_hole.position.set(x_pos, y_pos-0.05, z_pos);
				frame_hole.receiveShadow = true;
				frame_hole.castShadow = true;
                //door.add(frame_hole);

				var csg = new CSG();
				csg.subtract( [frame, frame_hole] );
					
				var c = csg.toMesh();
				c.material = new THREE.MeshLambertMaterial( {color: 'pink'} );
				c.receiveShadow = true;
				c.castShadow = true;
				door.add(c);

                doors.add(door);
				return door;
			}

			draw_doors(0.85, 2, 0.1, 1, 1, -3.1); //wc
			draw_doors(0.8, 2, 0.1, -1, 1, -3.1); //bath
			draw_doors(0.9, 2, 0.1, -3, 1, -1.9); //left bedroom

			draw_doors(0.8, 2, 0.1, 0, 1, -1.9).rotation.y = -Math.PI/2; //rigth bedroom
			var kitchen_door = draw_doors(0.8, 2, 0.1, 1, 1, 0.9); //kitchen
			kitchen_door.rotation.y = -Math.PI*3/2;
			draw_doors(0.6, 2, 0.1, -2.5, 1, 3.9).rotation.y = -Math.PI/2; //storage
			
			scene.add(doors);

			

		</script>
		
	</body>
</html>
